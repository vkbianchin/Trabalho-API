<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="janela">
        <div class="barra-superior">
            <span class="circulo vermelho"></span>
            <span class="circulo amarelo"></span>
            <span class="circulo verde"></span>
        </div>

        <div class="area-principal">
            <h1 class="titulo">Cadastro de Clientes</h1>

            <div id="mensagem" class="mensagem" role="alert"></div>

            <form id="form-cliente" class="formulario" novalidate>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="off" disabled>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="new-password"
                           maxlength="128" disabled aria-describedby="requisitos-senha">
                    <ul id="requisitos-senha" class="requisitos" aria-label="Requisitos da senha">
                        <li data-regra="tamanho"><span class="icone" aria-hidden="true">☐</span> Mínimo de 8 caracteres</li>
                        <li data-regra="maiuscula"><span class="icone" aria-hidden="true">☐</span> Uma letra maiúscula</li>
                        <li data-regra="minuscula"><span class="icone" aria-hidden="true">☐</span> Uma letra minúscula</li>
                        <li data-regra="numero"><span class="icone" aria-hidden="true">☐</span> Um número</li>
                        <li data-regra="especial"><span class="icone" aria-hidden="true">☐</span> Um caractere especial</li>
                    </ul>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" autocomplete="off"
                           placeholder="(00) 00000-0000" inputmode="numeric" disabled>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" autocomplete="off"
                           list="lista-cidades" disabled>
                    <datalist id="lista-cidades"></datalist>
                </div>

                <div class="acoes">
                    <button type="submit" id="btn-cadastrar" disabled>Cadastrar</button>
                </div>
            </form>

            <p class="link-alternativo">
                Já possui uma conta?
                <a href="{{ url_for('auth.pagina_login') }}">Entrar</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='Js/validacoes.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/script.js') }}"></script>
</body>
</html>
